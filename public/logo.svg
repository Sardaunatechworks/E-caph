<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#176B4D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0B3D2E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B7D84B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9BBF2E;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Brand Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Circle -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#grad1)" />
    <!-- Peace & Health Leaf Symbol -->
    <path d="M 50 20 C 30 35 25 65 50 80 C 75 65 70 35 50 20 Z" fill="url(#grad2)" />
    <path d="M 50 20 L 50 80" stroke="#176B4D" stroke-width="3" stroke-linecap="round" />
    <!-- Heart / Peace accent -->
    <circle cx="50" cy="42" r="8" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Typography -->
  <text x="125" y="62" font-family="'Manrope', 'Inter', sans-serif" font-weight="900" font-size="46" fill="#176B4D" letter-spacing="-1">e-CAPH</text>
  <text x="125" y="84" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#617069" letter-spacing="1.5">ACTION FOR PEACE &amp; HEALTH</text>
  <text x="125" y="98" font-family="'Inter', sans-serif" font-weight="500" font-size="10" fill="#9CA3AF" letter-spacing="0.5">NIGERIA</text>
</svg>
